<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="app_locustaf">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>app_locustaf</title>
  <link rel="manifest" href="manifest.json">

  <!--
    Google Sign-In web client ID.
    Reemplazá YOUR_WEB_CLIENT_ID.apps.googleusercontent.com por el Client ID
    web de tu proyecto Firebase (Authentication > Sign-in method > Google).
  -->
  <meta name="google-signin-client_id" content="167995437113-m9tbaos5e47rj8qjn3tpsicfimqo39vf.apps.googleusercontent.com">
  <!-- Google Identity Services SDK requerido por google_sign_in en web. -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
