name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  flutter:
    name: Flutter (analyze + test)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Patch pdfrx_engine cache
        run: |
          sed -i 's/(blockId + 1) \* cache.blockSize/(blockId + 1) \* cache!.blockSize/g' ~/.pub-cache/hosted/pub.dev/pdfrx_engine-0.4.4/lib/src/native/pdf_file_cache.dart
          sed -i 's/await cache.read(/await cache!.read(/g' ~/.pub-cache/hosted/pub.dev/pdfrx_engine-0.4.4/lib/src/native/pdf_file_cache.dart
      - name: Analyze
        run: flutter analyze --fatal-infos
      - name: Test
        run: flutter test

  functions:
    name: Cloud Functions (unit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Unit tests
        run: npm test

  firebase-rules:
    name: Firestore + Storage Rules (emuladores)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: test/security
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: test/security/package-lock.json
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies (incluye firebase-tools)
        run: npm ci
      - name: Security suite (96 tests)
        run: npm run test:full